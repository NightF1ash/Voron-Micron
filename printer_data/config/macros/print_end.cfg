[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    {% set th = printer.toolhead %}
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament

    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off PCF fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 5} F3600            ; park nozzle at rear
    
    {% if printer.configfile.settings.beacon is defined %} #Removes thermal expansion offset if defined
    _BEACON_REMOVE_NOZZLE_TEMP_OFFSET
    _BEACON_SET_NOZZLE_TEMP_OFFSET RESET=True
    {% endif %}
    
    BED_MESH_CLEAR

    _RESET_SPEED
    
    SET_FAN_SPEED FAN=BED_FAN SPEED=0 ;turn off bed fans
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=180 ;runs filter for 3 minutes after print finishes