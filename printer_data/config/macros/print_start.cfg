[gcode_macro PRINT_START]
gcode:

################################
## Parameter Definitions
################################

    {% set bed_temp = params.BED|int %}
    {% set chamber_temp = params.CHAMBER|default(0)|int %}
    {% set hotend_temp = params.EXTRUDER|int %}
    {% set relative_extruder = params.RELATIVE_E_MODE|default(false)|string %}
    {% set filament_type = params.FILAMENT|default(ABS)|string %}
    {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

################################
## 
################################

    _SET_MPC_MATERIAL MATERIAL={params.MATERIAL}
    G90 ;Absolute positioning
    M220 S100 ;Reset feedrate
    M221 S100 ;Reset flowrate
    {% if relative_extruder|lower == 'true' %} ;ensures extruder is in absolute mode
      M83 ;Set extruder to relative mode
    {% else %}
      M82 ;Set extruder to absolute mode
    {% endif %}

    SET_GCODE_OFFSET Z=0.0 MOVE=0   ; Zero the Z index again
    BED_MESH_CLEAR
    
    M117 Preheating Nozzle
    RESPOND PREFIX=🔥 MSG="Heating Nozzle to: 150"
    M104 S150

    M117 Heating bed...
    RESPOND PREFIX=🔥 MSG="Heating bed to: {bed_temp}"
    M140 S{bed_temp}           
    
    M117 Homing XYZ
    RESPOND PREFIX=🔁 MSG="Homing XYZ"
    G28
    RESPOND PREFIX=✅ MSG="Homing Complete"


  
################################
## Heatsoak/Bed Heating Code
################################

  {% if chamber_temp|int > 0 %}
     M117 Centering...
     RESPOND PREFIX=💢 MSG="Centering toolhead for heatsoak"
     G1 X{x_wait} Y{y_wait} Z10 F3000                                              ; Goes to center of the bed
     
     RESPOND PREFIX=☢️ MSG="Fans on"
     M106 S128                                                                        ; Turns on the Part cooling fan
     SET_FAN_SPEED FAN=filter SPEED=0.6                                                 ; Turns on filter
     SET_FAN_SPEED FAN=BED_FAN SPEED=0.6                                            ; Turns on the Bed Fans
     

     M117 Heatsoaking...
     RESPOND PREFIX=⏱️ MSG="Waiting for chamber temp to reach: {chamber_temp}"
     M190 S{bed_temp}                                                                ; Set and wait for bed to reach temperature
     TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM={chamber_temp}     ; Waits for chamber to reach desired temp
     RESPOND PREFIX=✅ MSG="Chamber Heated"
     
  # If chamber temp isn't required, then it skips the heatsoak and just heats up to the set bed temp.
  {% else %}
     M117 Heating bed...
     RESPOND PREFIX=🔥 MSG="Heating bed to: {bed_temp}"
     M190 S{bed_temp}                                                                 ; Sets target temp for the bed
   #  G4 P300000                                                                      ; Waits 5 min for the bedtemp to stabilize
     RESPOND PREFIX=✅ MSG="Bed temp is now {bed_temp}"
  {% endif %}


   # RESPOND PREFIX=🔁 MSG="waiting for Temp to stabilize"
    #G4 P30000                                                                         ; Wait 30s for temps to stabalise

################################
## QGL/Bed Leveling Code
################################

    M117 Cleaning Nozzle at {hotend_temp}
    RESPOND PREFIX=🧹 MSG="Cleaning nozzle before Z calibration"
    CLEAN_NOZZLE
    RESPOND PREFIX=✅ MSG="Nozzle is good as new"

    M117 Calibrating Beacon Hot
    RESPOND PREFIX=↕️ MSG="Calibrating Beacon Model"
    G28 Z METHOD=CONTACT CALIBRATE=1
    RESPOND PREFIX=✅ MSG="Beacon Model Created"

    M117 Leveling Gantry
    ;STATUS_LEVELING
    RESPOND PREFIX=🔁 MSG="Performing QGL"
    CQGL
    #QUAD_GANTRY_LEVEL
    RESPOND PREFIX=✅ MSG="QGL Complete"

    M117 Cleaning Nozzle at {hotend_temp}
    RESPOND PREFIX=🧹 MSG="Cleaning nozzle before Z calibration"
    CLEAN_NOZZLE
    RESPOND PREFIX=✅ MSG="Nozzle is good as new"

    M117 Calibrating Z-Offset
    RESPOND PREFIX=↕️ MSG="Calibrating Z-Offset"
    G28 Z METHOD=CONTACT CALIBRATE=0
    RESPOND PREFIX=✅ MSG="Z-Offset Found"

    M117 Scanning bed...
    RESPOND PREFIX=🔁 MSG="Creating bed mesh"
    BED_MESH_CALIBRATE ADAPTIVE=1
    RESPOND PREFIX=✅ MSG="Adaptive Bed Mesh complete"

    M117 Heating Nozzle
    RESPOND PREFIX=🔥 MSG="Heating nozzle to: {hotend_temp}"
    M109 S{hotend_temp}
    RESPOND PREFIX=✅ MSG="Nozzle now at {hotend_temp}"
    
################################
## Nozzle Cleaning and Purge
################################

    # M117 Cleaning Nozzle again, this time at {hotend_temp}
    # RESPOND PREFIX=🧹 MSG="Cleaning nozzle again, this time at {hotend_temp}"
    # CLEAN_NOZZLE
    # RESPOND PREFIX=✅ MSG="Nozzle is good as new"


    RESPOND PREFIX=↕💩 MSG="Purging"
    #NOZZLE_POOP ;Disabled because it still needs skirts will need to revisit
    SQUIGGLY_PURGE LINE_MARGIN=15 ADAPTIVE_MODE=1

   {% if printer.configfile.settings.beacon is defined %} #Applies thermal expansion offset if defined
    _BEACON_SET_NOZZLE_TEMP_OFFSET 
   {% endif %}
   
    RESPOND PREFIX=🏎️ MSG="3, 2, 1.. GO!"
    M117 Printing...
